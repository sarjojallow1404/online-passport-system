
spring.application.name=passport-backend

# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/passport_db}
spring.datasource.username=${DB_USERNAME:passport_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true

# Backend port
server.port=${PORT:8081}

# Passport document uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
passport.documents.storage-dir=${PASSPORT_DOCUMENT_STORAGE_DIR:${user.home}/.passport-system/private-documents}

# Notification worker
passport.notifications.enabled=${PASSPORT_NOTIFICATIONS_ENABLED:false}

# SMTP configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP security
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# SMTP connection timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender address
spring.mail.properties.mail.smtp.from=${MAIL_FROM:}
